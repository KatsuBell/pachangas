name: Copia de seguridad mensual
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar los partidos de Firestore
        run: |
          mkdir -p backups
          python3 - <<'PY'
          import json, datetime, urllib.request
          base = "https://firestore.googleapis.com/v1/projects/pachangapp-81f60/databases/(default)/documents/partidos"
          docs, token = [], None
          while True:
              url = base + "?pageSize=300" + ("&pageToken=" + token if token else "")
              data = json.load(urllib.request.urlopen(url))
              docs += data.get("documents", [])
              token = data.get("nextPageToken")
              if not token:
                  break
          def val(v):
              k, x = next(iter(v.items()))
              if k == "mapValue": return {a: val(b) for a, b in x.get("fields", {}).items()}
              if k == "arrayValue": return [val(i) for i in x.get("values", [])]
              if k == "integerValue": return int(x)
              if k == "nullValue": return None
              return x
          out = [{a: val(b) for a, b in d.get("fields", {}).items()} for d in docs]
          name = "backups/partidos-%s.json" % datetime.date.today().isoformat()
          json.dump(out, open(name, "w"), ensure_ascii=False)
          print(len(out), "partidos guardados en", name)
          PY
      - name: Guardar en el repositorio
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git commit -m "Copia de seguridad" || echo "Sin cambios"
          git push
